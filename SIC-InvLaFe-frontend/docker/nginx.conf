# nginx del frontend: sirve la app y reenvía /api al backend.
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Igual que el límite del backend (100 KB), con margen.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # La API: `backend` es el nombre del servicio en compose.yaml.
    location /api/ {
        proxy_pass http://backend:3000;
        # $http_host conserva el puerto: el backend lo usa para reconocer que
        # la petición viene de su propia página.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Archivos con huella en el nombre (cambian de nombre en cada versión):
    # el navegador puede guardarlos un año.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cualquier otra ruta es de la app (React Router): se responde index.html.
    # Sin caché, para que una versión nueva se vea al recargar.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
